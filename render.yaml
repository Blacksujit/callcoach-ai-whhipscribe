services:
  - type: web
    name: callcoach-backend
    region: oregon
    env: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: WHIPSKRIBE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: CORS_ORIGINS
        value: "https://callcoach-ai-dashboard.vercel.app,https://callcoach-ai-whhipscribe.vercel.app"
    healthCheck:
      path: /api/health
      intervalSeconds: 300
    plan: free
