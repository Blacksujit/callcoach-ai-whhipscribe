services:
  - type: web
    name: callcoach-backend
    region: oregon
    env: docker
    plan: free
    autoDeploy: true
    healthCheck:
      path: /api/health
      intervalSeconds: 300
    envVars:
      - key: WHIPSKRIBE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: "https://callcoach-ai-dashboard.vercel.app,https://callcoach-ai-whhipscribe.vercel.app"
      - key: FRONTEND_URL
        value: "https://callcoach-ai-dashboard.vercel.app"
      - key: FLASK_SECRET_KEY
        value: "prod-secret-key-2026"
      - key: DB_PATH
        value: /data/callcoach.db
